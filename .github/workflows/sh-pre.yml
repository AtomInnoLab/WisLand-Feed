name: sh-pre

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: true

env:
  KUBECTL_VERSION: v1.32.2
  NAMESPACE: shpre
  REPO_NS: atom-pre
  REPO_APP: wisland-feed-pre
  REGION_ID: cn-shanghai
  DEPLOYMENT: wisland-feed-pre

  REPO: ${{ secrets.ALI_DOCKER_REGISTRY }}
  REPO_USER: ${{ secrets.ALI_DOCKER_REGISTRY_USERNAME_PENGHAO }}
  REPO_PASSWD: ${{ secrets.ALI_DOCKER_REGISTRY_PASSWD_PENGHAO }}
  FEISHU_WEBHOOK_URL_PRE_SH: ${{ secrets.FEISHU_WEBHOOK_URL_PRE_SH }}
  KUBECONFIG_PRE_SH: ${{ secrets.KUBECONFIG_DEV_SH }}

jobs:
  build_and_push:
    name: build_and_push
    permissions:
      contents: write
    runs-on: [ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}

      - name: Install Rust-stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0
          override: true
          cache: true

      - name: Set proxy
        run: |
          rm -rf ~/.gitconfig || true
          git config --global url."https://${{ secrets.GH_ACCESS_TOKEN }}@github.com".insteadOf ssh://git@github.com
          git config --global credential.helper store

      - name: Building
        shell: bash
        run: cargo build -r

      - name: Generate Docker Tag
        id: docker_tag
        run: |
          datetime_now=$(TZ='Asia/Shanghai' date "+%Y%m%d%H%M%S")
          echo "DOCKER_TAG=${datetime_now}" >> $GITHUB_ENV
          echo "tag=${datetime_now}" >> $GITHUB_OUTPUT

      - name: Log in to Aliyun ACR
        run: |
          docker login \
            -u ${{ env.REPO_USER }} \
            -p ${{ env.REPO_PASSWD }} \
            ${{ env.REPO }}

      - name: Build and Push Docker Image
        run: |
          sudo apt-get update && sudo apt-get install -y retry
          docker build --build-arg APP_PROFILE=pre -f Dockerfile.server -t ${{ env.REPO }}/${{ env.REPO_NS }}/${{ env.REPO_APP }}:server-${{ env.DOCKER_TAG }} --platform=linux/amd64 .
          docker build --build-arg APP_PROFILE=pre -f Dockerfile.worker -t ${{ env.REPO }}/${{ env.REPO_NS }}/${{ env.REPO_APP }}:worker-${{ env.DOCKER_TAG }} --platform=linux/amd64 .
          retry -t 5 -- docker push ${{ env.REPO }}/${{ env.REPO_NS }}/${{ env.REPO_APP }}:server-${{ env.DOCKER_TAG }}
          retry -t 5 -- docker push ${{ env.REPO }}/${{ env.REPO_NS }}/${{ env.REPO_APP }}:worker-${{ env.DOCKER_TAG }}

      - name: Setup kubectl
        uses: ./.github/actions/setup-kubectl-ack
        with:
          kubectl-version: ${{ env.KUBECTL_VERSION }}
          kubeconfig-env: ${{ env.KUBECONFIG_PRE_SH }}

      - name: Update
        run: |
          kubectl -n "${{ env.NAMESPACE }}" set image deployment/${{ env.DEPLOYMENT }} \
            ${{ env.DEPLOYMENT }}-server=${{ env.REPO }}/${{ env.REPO_NS }}/${{ env.REPO_APP }}:server-${{ env.DOCKER_TAG }} \
            ${{ env.DEPLOYMENT }}-worker=${{ env.REPO }}/${{ env.REPO_NS }}/${{ env.REPO_APP }}:worker-${{ env.DOCKER_TAG }}

      - name: Notify Feishu - update
        uses: ./.github/actions/send-feishu
        with:
          webhook: ${{ env.FEISHU_WEBHOOK_URL_PRE_SH }}
          status-emoji: "🟢"
          title: "ACK: ${{ env.DEPLOYMENT }} released"
          details: "仓库: ${{ github.repository }}%0A分支: ${{ github.ref_name }}%0A提交: ${{ github.sha }}%0A镜像: ${{ env.DOCKER_TAG }}"

  notify_failed_job:
    name: notify_failed_job
    needs: [build_and_push]
    if: always() && needs.build_and_push.result == 'failure'
    runs-on: [ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}

      - name: Notify Feishu - failed
        uses: ./.github/actions/send-feishu
        with:
          webhook: ${{ env.FEISHU_WEBHOOK_URL_PRE_SH }}
          status-emoji: "🔴"
          title: "ACK: ${{ env.DEPLOYMENT }} failed"
          details: "仓库: ${{ github.repository }}%0A分支: ${{ github.ref_name }}%0A提交: ${{ github.sha }}"
