name: dev

on:
  pull_request_target:
    branches: [dev]
    types: [closed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: true

# 新加坡部署：使用新加坡阿里云镜像仓库 (ap-southeast-1)，k8s 使用 imagePullSecrets: registry-ali-sp
env:
  KUBECTL_VERSION: v1.32.2
  NAMESPACE: dev-ns
  REPO_NS: ${{ secrets.ALICLOUD_ACR_SP_NSDEV }}
  REGION_ID: ap-southeast-1
  DEPLOYMENT: wisland-feed-dev

  REPO_PUB: ${{ secrets.ALICLOUD_ACR_SP_PUBLIC }}
  REPO_VPC: ${{ secrets.ALICLOUD_ACR_SP_VPC }}
  FEISHU_WEBHOOK_URL_DEV: ${{ secrets.FEISHU_WEBHOOK_URL_DEV }}
  KUBECONFIG_DEV: ${{ secrets.KUBECONFIG_DEV }}

jobs:
  deploy_to_dev:
    if: |
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      github.event_name == 'workflow_dispatch'
    name: build_and_push
    permissions:
      contents: write
    runs-on: [ubuntu-22.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}

      - name: Install Rust-stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0
          override: true
      
      - name: Set proxy
        run: |
          rm -rf ~/.gitconfig || true
          git config --global url."https://${{ secrets.GH_ACCESS_TOKEN }}@github.com".insteadOf ssh://git@github.com
          git config --global credential.helper store

      - name: Building
        shell: bash
        run: cargo build -r

      - name: Generate Docker Tag
        id: docker_tag
        run: |
          datetime_now=$(TZ='Asia/Shanghai' date "+%Y%m%d%H%M%S")
          echo "DOCKER_TAG=${datetime_now}" >> $GITHUB_ENV

      - name: Log in to private registry (base image)
        run: |
          docker login \
            -u ${{ secrets.ALI_DOCKER_REGISTRY_USERNAME_PENGHAO }} \
            -p ${{ secrets.ALI_DOCKER_REGISTRY_PASSWD_PENGHAO }} \
            ${{ secrets.ALI_DOCKER_REGISTRY }}

      - name: Build Docker images
        run: |
          docker build --build-arg APP_PROFILE=dev -f Dockerfile.server -t ${{ env.REPO_PUB }}/${{ env.REPO_NS }}/${{ env.DEPLOYMENT }}:server-${{ env.DOCKER_TAG }} .
          docker build --build-arg APP_PROFILE=dev -f Dockerfile.worker -t ${{ env.REPO_PUB }}/${{ env.REPO_NS }}/${{ env.DEPLOYMENT }}:worker-${{ env.DOCKER_TAG }} .

      - name: Log in to Aliyun ACR (Singapore)
        uses: ./.github/actions/acr-docker-login
        with:
          access-key-id: ${{ secrets.ALICLOUD_ACCESS_KEY_PH }}
          secret-access-key: ${{ secrets.ALICLOUD_SECRET_KEY_PH }}
          instance-id: ${{ secrets.ALICLOUD_ACR_INSTANCE_ID }}
          registry-url: ${{ secrets.ALICLOUD_ACR_SP_PUBLIC }}
          region-id: ${{ env.REGION_ID }}

      - name: Push Docker images
        run: |
          sudo apt-get update && sudo apt-get install -y retry
          retry -t 5 -- docker push ${{ env.REPO_PUB }}/${{ env.REPO_NS }}/${{ env.DEPLOYMENT }}:server-${{ env.DOCKER_TAG }}
          retry -t 5 -- docker push ${{ env.REPO_PUB }}/${{ env.REPO_NS }}/${{ env.DEPLOYMENT }}:worker-${{ env.DOCKER_TAG }}

      - name: Setup kubectl
        uses: ./.github/actions/setup-kubectl-ack
        with:
          kubectl-version: ${{ env.KUBECTL_VERSION }}
          kubeconfig-env: ${{ env.KUBECONFIG_DEV }}

      - name: Update
        run: |
          kubectl -n "${{ env.NAMESPACE }}" set image deployment/${{ env.DEPLOYMENT }} \
            ${{ env.DEPLOYMENT }}-server=${{ env.REPO_VPC }}/${{ env.REPO_NS }}/${{ env.DEPLOYMENT }}:server-${{ env.DOCKER_TAG }} \
            ${{ env.DEPLOYMENT }}-worker=${{ env.REPO_VPC }}/${{ env.REPO_NS }}/${{ env.DEPLOYMENT }}:worker-${{ env.DOCKER_TAG }}

      - name: Notify Feishu - update
        uses: ./.github/actions/send-feishu
        with:
          webhook: ${{ env.FEISHU_WEBHOOK_URL_DEV }}
          status-emoji: "🟢"
          title: "ACK: ${{ env.DEPLOYMENT }} released"
          details: "仓库: ${{ github.repository }}%0A分支: ${{ github.ref_name }}%0A提交: ${{ github.sha }}%0A镜像: ${{ env.DOCKER_TAG }}"

  notify_failed_job:
    name: notify_failed_job
    needs: [deploy_to_dev]
    if: always() && needs.deploy_to_dev.result == 'failure'
    runs-on: [ubuntu-22.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
      
      - name: Notify Feishu - failed
        uses: ./.github/actions/send-feishu
        with:
          webhook: ${{ env.FEISHU_WEBHOOK_URL_DEV }}
          status-emoji: "🔴"
          title: "ACK: ${{ env.DEPLOYMENT }} failed"
          details: "仓库: ${{ github.repository }}%0A分支: ${{ github.ref_name }}%0A提交: ${{ github.sha }}"