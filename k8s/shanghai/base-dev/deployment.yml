apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisland-feed-dev
  namespace: shdev
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: wisland-feed-dev
      version: v1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: wisland-feed-dev
        version: v1
    spec:
      imagePullSecrets:
        - name: registry-ali-hangzhou
      containers:
        - name: wisland-feed-dev-server
          image: crpi-hytqalx0cm8oqxr4.cn-hangzhou.personal.cr.aliyuncs.com/mxrag-dev/wisland-feed-dev:server-20251127152426
          imagePullPolicy: IfNotPresent
          env:
            - name: aliyun_logs_wisland-feed-dev-server
              value: stdout
            - name: ENVIRONMENT
              value: dev
            - name: NACOS_ENDPOINT
              value: 'mse-e3004940-nacos-ans.mse.aliyuncs.com:8848'
            - name: NACOS_NAMESPACE
              value: 428d61ac-cbd2-46d9-802d-9cac49065b69
            - name: SITE
              value: cn
          ports:
            - containerPort: 3500
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 15
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 3500
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            tcpSocket:
              port: 3500
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 2
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 100Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /app/.env
              name: volume-wisland-feed-dev
              subPath: .env

        - name: wisland-feed-dev-worker
          image: crpi-hytqalx0cm8oqxr4.cn-hangzhou.personal.cr.aliyuncs.com/mxrag-dev/wisland-feed-dev:worker-20251127152426
          imagePullPolicy: IfNotPresent
          env:
            - name: aliyun_logs_wisland-feed-dev-worker
              value: stdout
            - name: ENVIRONMENT
              value: dev
            - name: NACOS_ENDPOINT
              value: 'mse-e3004940-nacos-ans.mse.aliyuncs.com:8848'
            - name: NACOS_NAMESPACE
              value: 428d61ac-cbd2-46d9-802d-9cac49065b69
            - name: SITE
              value: cn
          resources:
            limits:
              cpu: 2
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 100Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /app/.env
              name: volume-wisland-feed-dev
              subPath: .env

      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 120
      volumes:
        - name: volume-wisland-feed-dev
          secret:
            defaultMode: 420
            secretName: wisland-feed-dev
