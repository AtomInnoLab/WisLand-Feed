apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisland-feed-pre
  namespace: shpre
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: wisland-feed-pre
      version: v1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: wisland-feed-pre
        version: v1
    spec:
      imagePullSecrets:
        - name: registry-ali-hangzhou
        - name: registry-ali-sh-ee
      containers:
        - name: wisland-feed-pre-server
          image: atom-sh-registry-vpc.cn-shanghai.cr.aliyuncs.com/atom-pre/wisland-feed-pre:server-latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NACOS_ENABLE
              value: "true"
            - name: APP_PROFILE
              value: pre
            - name: ENVIRONMENT
              value: pre
            - name: NACOS_ENDPOINT
              value: "mse-e3004940-nacos-ans.mse.aliyuncs.com:8848"
            - name: NACOS_NAMESPACE
              value: d54b78a4-4350-41dc-9502-5d6d2e769755
            - name: SITE
              value: cn
            - name: aliyun_logs_wisland-feed-pre-server
              value: stdout
          ports:
            - containerPort: 3500
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 15
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 3500
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            tcpSocket:
              port: 3500
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 0.5
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 100Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /app/.env
              name: volume-wisland-feed-pre
              subPath: .env

        - name: wisland-feed-pre-worker
          image: atom-sh-registry-vpc.cn-shanghai.cr.aliyuncs.com/atom-pre/wisland-feed-pre:worker-latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NACOS_ENABLE
              value: "true"
            - name: APP_PROFILE
              value: pre
            - name: ENVIRONMENT
              value: pre
            - name: NACOS_ENDPOINT
              value: "mse-e3004940-nacos-ans.mse.aliyuncs.com:8848"
            - name: NACOS_NAMESPACE
              value: d54b78a4-4350-41dc-9502-5d6d2e769755
            - name: SITE
              value: cn
            - name: aliyun_logs_wisland-feed-pre-worker
              value: stdout
          resources:
            limits:
              cpu: 0.5
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 100Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /app/.env
              name: volume-wisland-feed-pre
              subPath: .env

      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 120
      volumes:
        - name: volume-wisland-feed-pre
          secret:
            defaultMode: 420
            secretName: wisland-feed-pre
