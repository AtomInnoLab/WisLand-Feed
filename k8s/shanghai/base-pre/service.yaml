apiVersion: v1
kind: Service
metadata:
  namespace: shpre
  name: wisland-feed-pre-service
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: tcp80
      port: 80
      protocol: TCP
      targetPort: 3500
    - name: tcp443
      port: 443
      protocol: TCP
      targetPort: 3500
  selector:
    app: wisland-feed-pre
    version: v1
  sessionAffinity: None
  type: ClusterIP
